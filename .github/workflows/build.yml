name: Build Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex \
          libssl-dev python3 device-tree-compiler

      - name: Download GCC toolchain
        run: |
          mkdir -p toolchain
          git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 \
          toolchain/gcc -b lineage-19.1 --depth=1

      - name: Build kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=$GITHUB_WORKSPACE/toolchain/gcc/bin/aarch64-linux-android-
          export HOSTCFLAGS="-fcommon"
          make O=out exynos8895-greatlte_defconfig
          make O=out -j$(nproc) HOSTCFLAGS="-fcommon"

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: kernel-output
          path: out/arch/arm64/boot/Image
